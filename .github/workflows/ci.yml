name: ci

on:
  push:
  pull_request:

jobs:
  hooks-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell hook tests
        run: pwsh -NoProfile -File tests/run.ps1

  hooks-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bash hook tests
        run: bash tests/run.sh
